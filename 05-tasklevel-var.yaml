- name: variables
  hosts: local
  connection: local
  vars: 
   COURSE: Devops
   DURATION: 130HRS
   TRAINER: Shini
  tasks:
  - name: print variables
    vars:
     COURSE: ansible
    ansible.builtin.debug:
      msg: "course is {{ COURSE }}, Trainer is {{ TRAINER }}, Duration is {{ DURATION }} "

