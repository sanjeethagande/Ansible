- name: remove packages
  hosts: local
  connection: local
  become: yes
  tasks:
   - name: remove package
     ansible.builtin.package:
       name: "{{ item.name }}"
       state: "{{ item.state}}"
     loop:
       - { name: "mysql", state: "absent" }
       - { name: "nginx", state: "present" }
       - { name: "zip", state: "absent" }